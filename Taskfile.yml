# Playtron OS Taskfile
# https://taskfile.dev

version: "3"

env:
  IMAGE: playtronos
  PUBLIC_IMAGE: playtron-os
  # Default to 'podman build --no-cache' unless this environment variable is defined.
  CACHE: "{{ if not .CACHE }}--no-cache{{ end }}"

tasks:
  rpm-repo:
    desc: Build a local rpm-ostree repository with local RPMs.
    dir: rpm-ostree
    cmds:
      - mkdir -p /tmp/repo || true
      - echo "Checking if any RPMs exist in the /tmp/repo/ directory..."
      - ls /tmp/repo | grep rpm || exit 1
      - createrepo /tmp/repo
      - grep "  - local" playtron-os.yaml || sed -i s'/repos:/repos:\n  - local'/g playtron-os.yaml
      - echo -e "[local]\nname=local\nbaseurl=file:///tmp/repo\nenabled=1\nrepo_gpgcheck=0\ngpgcheck=0" > local.repo

  container-image:auth:
    desc: Authenticate with the container registry.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: test -n "$REGISTRY_TOKEN"
        msg: "A value for REGISTRY_TOKEN must be provided"
    cmds:
      - mkdir -p ${XDG_RUNTIME_DIR}/containers
      - echo "{ \"auths\":{ \"${REGISTRY}\":{ \"auth\":\"${REGISTRY_TOKEN}\" } } }" > "${XDG_RUNTIME_DIR}/containers/auth.json"

  container-image:build:unstable:
    desc: >-
      Build the OCI container image using the latest upstream.
      Set PLATFORM=arm64 to cross-build for Arm; that needs qemu-user-static installed and the
      aarch64 binfmt handler registered on the build host.
    vars:
      PLATFORM: '{{.PLATFORM | default ""}}'
    preconditions:
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - mkdir -p rootfs/usr/lib
      - cat os-release.template | envsubst '${TAG}' > rootfs/usr/lib/os-release-playtron
      - podman build {{.CACHE}} --pull=always {{if .PLATFORM}}--platform linux/{{.PLATFORM}} {{end}}--tag ${IMAGE}:${TAG} --file containerfiles/unstable .

  container-image:build:stable:
    desc: >-
      Build the OCI container image using a previously built image.
      Set PLATFORM=arm64 to cross-build for Arm.
    vars:
      PLATFORM: '{{.PLATFORM | default ""}}'
    preconditions:
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - mkdir -p rootfs/usr/lib
      - cat os-release.template | envsubst '${TAG}' > rootfs/usr/lib/os-release-playtron
      - podman build {{.CACHE}} {{if .PLATFORM}}--platform linux/{{.PLATFORM}} {{end}}--tag ${IMAGE}:${TAG} --file containerfiles/stable .

  container-image:push:
    desc: Push the OCI container image to the container registry.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
    cmds:
      - podman push ${IMAGE}:${TAG} ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}

  container-image:push:arch:
    desc: >-
      Push a single-architecture OCI container image under an architecture-suffixed tag.
      Use this instead of `container-image:push` for anything other than amd64, and combine the
      results with `container-image:push:multiarch`. Pushing an arm64 image to the bare tag would
      replace the amd64 image and ship Arm to x86 devices.
    requires:
      vars:
        - name: ARCH
          enum: [amd64, arm64]
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
    cmds:
      - podman push ${IMAGE}:${TAG} ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}-{{.ARCH}}

  container-image:push:multiarch:
    desc: >-
      Combine the architecture-suffixed images into a multi-arch manifest and push it to the bare
      tag. Assumes `container-image:push:arch` has already pushed both `${TAG}-amd64` and
      `${TAG}-arm64`.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}-amd64
        msg: "Failed to fetch the amd64 container"
      - sh: podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}-arm64
        msg: "Failed to fetch the arm64 container"
    cmds:
      - podman manifest rm ${IMAGE}:${TAG} || true
      - >-
        podman manifest create ${IMAGE}:${TAG}
        ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}-amd64
        ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}-arm64
      - podman manifest inspect ${IMAGE}:${TAG}
      - podman manifest push --all ${IMAGE}:${TAG} ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}

  container-image:deploy:
    desc: Deploy a locally built container image to a device over SSH
    vars:
      SSH_USER: playtron
      REGISTRY: localhost
    preconditions:
      - sh: test -n "{{.SSH_USER}}"
        msg: "A value for SSH_USER must be provided"
      - sh: test -n "{{.SSH_HOST}}"
        msg: "A value for SSH_HOST must be provided"
      - sh: test -n "{{.IMAGE}}"
        msg: "A value for IMAGE must be provided"
      - sh: test -n "{{.TAG}}"
        msg: "A value for TAG must be provided"
      - sh: test -n "{{.REGISTRY}}"
        msg: "A value for REGISTRY must be provided"
    cmds:
      - podman save --format oci-archive {{.REGISTRY}}/{{.IMAGE}}:{{.TAG}} | pv --name "Copying" | ssh {{.SSH_USER}}@{{.SSH_HOST}} 'cat > /var/tmp/{{.IMAGE}}-{{.TAG}}.oci'
      - ssh -t {{.SSH_USER}}@{{.SSH_HOST}} 'sudo LANG="en_US.UTF-8" LC_ALL="en_US.UTF-8" bootc switch --transport oci-archive /var/tmp/{{.IMAGE}}-{{.TAG}}.oci'

  container-image:release:
    desc: Release the OCI container image by tagging it as `latest` in the container registry.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
    cmds:
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman push ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} ${REGISTRY}/${PROJECT}/${IMAGE}:latest

  container-image:inspect:
    desc: Inspect the OCI container image by opening a shell inside the container.
    preconditions:
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
    cmds:
      - podman run --rm -it ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} bash

  disk-image:kickstart:
    desc: Build the OS image from a container hosted in the public registry using kickstart.
    env:
      TAG: latest
      PROJECT: playtron-os
      REGISTRY: ghcr.io
      IMAGE: playtron-os
      REGISTRY_TOKEN:
    dir: kickstart
    preconditions:
      - sh: test "$EUID" == 0
        msg: "This task must be run as root"
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$IMAGE"
        msg: "A value for IMAGE must be provided"
    cmds:
      - cat playtron-os_kickstart.cfg.template | envsubst '${REGISTRY} ${REGISTRY_TOKEN} ${PROJECT} ${IMAGE} ${TAG}' > playtron-os_kickstart.cfg
      - if command -v setenforce &> /dev/null; then sudo setenforce 0; fi
      - ./virt-install.sh
      - mv /var/lib/libvirt/images/playtron-os.img "/var/lib/libvirt/images/playtron-os.img_$(date -Iseconds)"
      - virsh undefine --nvram playtron-os

  disk-image:bootc:
    desc: Build the OS image from a container hosted in a registry using bootc image builder (AMD64).
    preconditions:
      - sh: test "$EUID" == 0
        msg: "This task must be run as root"
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$IMAGE"
        msg: "A value for IMAGE must be provided"
    env:
      BOOTC_IMAGE: ghcr.io/playtron-os/bootc-image-builder:latest
    cmds:
      - rm -rf output
      - mkdir output
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman run --rm -it --privileged --pull=newer --security-opt label=type:unconfined_t -v ./config.toml:/config.toml:ro -v ./output:/output -v /var/lib/containers/storage:/var/lib/containers/storage ${BOOTC_IMAGE} --type raw --rootfs btrfs ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}

  disk-image:bootc:arm:
    desc: Build the OS image from a container hosted in a registry using bootc image builder (ARM).
    cmds:
      - task: disk-image:bootc
        env:
          BOOTC_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

  disk-image:bootc:local:
    desc: Build the OS image from a local container using bootc image builder (AMD64).
    preconditions:
      - sh: test "$EUID" == 0
        msg: "This task must be run as root"
      - sh: test -n "$IMAGE"
        msg: "A value for IMAGE must be provided"
    env:
      BOOTC_IMAGE: ghcr.io/playtron-os/bootc-image-builder:latest
    cmds:
      - rm -rf output
      - mkdir output
      - podman run --rm -it --privileged --pull=newer --security-opt label=type:unconfined_t -v ./config.toml:/config.toml:ro -v ./output:/output -v /var/lib/containers/storage:/var/lib/containers/storage ${BOOTC_IMAGE} --type raw --rootfs btrfs localhost/${IMAGE}:${TAG}

  disk-image:bootc:local:arm:
    desc: Build the OS image from a local container using bootc image builder (ARM).
    cmds:
      - task: disk-image:bootc:local
        env:
          BOOTC_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

  arm:dtb:refresh:
    desc: >-
      Refresh arm/dtbs/glymur-crd-cob from the kernel currently pinned in
      rootfs/usr/libexec/playtron-build-arm64/kernel-install.sh. Run this after bumping the kernel;
      the container build fails if the two disagree, because a stale DTB paired with a new kernel
      does not boot.
    vars:
      AGENTOS_URL: https://playtron-dev2-global-os-public.s3.us-west-2.amazonaws.com/repos/agentos/aarch64
      KERNEL_SCRIPT: rootfs/usr/libexec/playtron-build-arm64/kernel-install.sh
    cmds:
      - |
        set -e
        nvra=$(grep -oE '"kernel-[^"]+"' {{.KERNEL_SCRIPT}} | head -1 | tr -d '"')
        if [ -z "$nvra" ]; then echo "Could not find the pinned kernel in {{.KERNEL_SCRIPT}}" >&2; exit 1; fi
        echo "Pinned kernel: ${nvra}"
        # '+' is legal in an RPM release but must be percent-encoded in the URL
        url="{{.AGENTOS_URL}}/$(printf '%s' "${nvra}" | sed 's/+/%2B/g').aarch64.rpm"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        echo "Fetching ${url}"
        curl -fsSL -o "$tmp/k.rpm" "$url"
        rpm2cpio "$tmp/k.rpm" | (cd "$tmp" && cpio -idm --quiet './lib/modules/*/dtb/qcom/glymur-crd.dtb')
        src=$(find "$tmp" -name glymur-crd.dtb | head -1)
        if [ -z "$src" ]; then echo "No dtb/qcom/glymur-crd.dtb in ${nvra}" >&2; exit 1; fi
        cp "$src" arm/dtbs/glymur-crd-cob
        echo "Updated arm/dtbs/glymur-crd-cob ($(stat -c %s arm/dtbs/glymur-crd-cob) bytes, md5 $(md5sum arm/dtbs/glymur-crd-cob | cut -d' ' -f1))"

  disk-image:arm:
    desc: Customize the generic ARM disk image to boot on a particular Arm device
    requires:
      vars:
        - name: TARGET
          enum: [x13s, glymur-crd-cob, glymur-crd-sip]
    preconditions:
      - sh: command -v kpartx
        msg: "Could not find `kpartx`. Please install the appropriate package."
      - sh: test -f output/image/disk.raw
        msg: "Disk image not found. Please run `disk-image:bootc` to generate the generic ARM disk image."
      - sh: test -f arm/dtbs/{{.TARGET}}
        msg: "No DTB found at arm/dtbs/{{.TARGET}}"
      - sh: test "$EUID" == 0
        msg: "This task must be run as root"
    cmds:
      - cp output/image/disk.raw output/image/{{.TARGET}}.raw
      - ./arm/customize {{.TARGET}}

  disk-image:x13s:
    desc: Customize the generic ARM disk image to boot on the X13S
    cmds:
      - task: disk-image:arm
        vars:
          TARGET: x13s

  disk-image:glymur-crd:
    desc: Customize the generic ARM disk image to boot on the Glymur (Snapdragon X2 Elite) CRD
    cmds:
      - task: disk-image:arm
        vars:
          TARGET: glymur-crd-cob

  repo:update:
    desc: "Update the package repository"
    env:
      REPO_DIR: /tmp/repo-x86_64
    cmds:
      - mkdir -p "${REPO_DIR}"
      - aws s3 sync s3://playtron-dev2-global-os-public/repos/playtron-app/x86_64/ "${REPO_DIR}"
      - read -p "Copy new packages into ${REPO_DIR} and press ENTER to continue"
      - createrepo "${REPO_DIR}"
      - aws s3 sync "${REPO_DIR}" s3://playtron-dev2-global-os-public/repos/playtron-app/x86_64/

  repo:update:arm:
    desc: "Update the ARM package repository"
    env:
      REPO_DIR: /tmp/repo-aarch64
    cmds:
      - mkdir -p "${REPO_DIR}"
      - aws s3 sync s3://playtron-dev2-global-os-public/repos/playtron-app/aarch64/ "${REPO_DIR}"
      - read -p "Copy new packages into ${REPO_DIR} and press ENTER to continue"
      - createrepo "${REPO_DIR}"
      - aws s3 sync "${REPO_DIR}" s3://playtron-dev2-global-os-public/repos/playtron-app/aarch64/

  repo:archive:
    desc: "Archive exact RPM versions used in the container image"
    preconditions:
      - sh: test -n "{{.REGISTRY}}"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "{{.REGISTRY}}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "{{.PROJECT}}"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "{{.IMAGE}}"
        msg: "A value for IMAGE must be provided"
      - sh: test -n "{{.TAG}}"
        msg: "A value for TAG must be provided"
      - sh: test -n "{{.ARCH}}"
        msg: "A value for ARCH ('x86_64' or 'aarch64') must be provided"
    cmds:
      - podman pull {{.REGISTRY}}/{{.PROJECT}}/{{.IMAGE}}:{{.TAG}}
      - podman run -it -v $(pwd):/output {{.REGISTRY}}/{{.PROJECT}}/{{.IMAGE}}:{{.TAG}} /output/scripts/archive-rpms.sh {{.TAG}} 2> /dev/stdout | tee ./repo-archive-{{.TAG}}.log
      - aws s3 sync ./repo-archive-{{.TAG}}/ s3://playtron-dev2-global-os-public/repos/playtron-gameos-{{.TAG}}/{{.ARCH}}/

  public:auth:
    desc: Authenticate with the GitHub container registry.
    preconditions:
      - sh: test -n "$GITHUB_USER"
        msg: "A value for GITHUB_USER must be provided"
      - sh: test -n "$GITHUB_TOKEN"
        msg: "A value for GITHUB_TOKEN must be provided"
    cmds:
      - echo $GITHUB_TOKEN | podman login ghcr.io -u $GITHUB_USER --password-stdin

  public:push:
    desc: Publish the container to the public registry.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: grep "ghcr.io" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `public:auth` to authenticate with the GitHub registry"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman push ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} ghcr.io/playtron-os/${PUBLIC_IMAGE}:${TAG}

  public:release:
    desc: Publish the container to the public registry with the tag 'latest'.
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: grep "ghcr.io" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `public:auth` to authenticate with the GitHub registry"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman push ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} ghcr.io/playtron-os/${PUBLIC_IMAGE}:${TAG}
      - podman push ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} ghcr.io/playtron-os/${PUBLIC_IMAGE}:latest

  package-list:
    desc: Generate a list of packages that are installed in a remote container without version numbers
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman run -it ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} rpm -qa --qf "%{NAME}\n" | sort -u > playtron-os-${TAG}.pkg-list.txt

  package-list:versioned:
    desc: Generate a list of packages that are installed in a remote container with version numbers
    preconditions:
      - sh: test -n "$REGISTRY"
        msg: "A value for REGISTRY must be provided"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: grep "${REGISTRY}" "${XDG_RUNTIME_DIR}/containers/auth.json"
        msg: "Please use `container-image:auth` to authenticate with the registry"
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - podman pull ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG}
      - podman run -it ${REGISTRY}/${PROJECT}/${IMAGE}:${TAG} rpm -qa | sort -u > playtron-os-${TAG}.versioned.pkg-list.txt

  package-list:local:versioned:
    desc: Generate a list of packages that are installed in a local container with version numbers
    preconditions:
      - sh: test -n "$PROJECT"
        msg: "A value for PROJECT must be provided"
      - sh: test -n "$TAG"
        msg: "A value for TAG must be provided"
    cmds:
      - podman run -it ${IMAGE}:${TAG} rpm -qa | sort -u > playtron-os-${TAG}.versioned.pkg-list.txt

  test:
    desc: Run all tests
    dir: tests
    cmds:
      - ./run.sh
